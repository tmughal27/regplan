[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regplan"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "ortools>=9.10",
    "networkx>=3.2",
    "numpy>=1.24",
    "typer>=0.9",
    "streamlit>=1.30",
    "jinja2>=3.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
regplan = "regplan.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/regplan"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=regplan --cov-report=term-missing --cov-fail-under=80"
